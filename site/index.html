<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>DDL 看板</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e7eb;--brand:#4f46e5;--danger:#dc2626;--warn:#d97706;--ok:#059669}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}.page{max-width:1240px;margin:0 auto;padding:24px}
    .hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin-bottom:18px}h1{margin:0;font-size:30px;letter-spacing:-.03em}.sub{color:var(--muted);margin-top:4px}.actions{display:flex;gap:10px;flex-wrap:wrap}
    button,.button{border:0;border-radius:10px;padding:9px 13px;font-weight:700;text-decoration:none;cursor:pointer;background:var(--brand);color:#fff}button.secondary,.button.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.55;cursor:wait}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:13px}
    .bar{background:linear-gradient(110deg,#111827,#312e81);color:white;border-radius:18px;padding:18px 20px;margin-bottom:16px}.bar h2{margin:0 0 5px;font-size:18px}.bar p{margin:0;color:#c7d2fe}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-title h2{margin:0;font-size:19px}.section-title span{font-size:13px;color:var(--muted)}
    .list{display:grid;gap:10px}.task{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:.15s}.task:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(15,23,42,.09)}.stripe{width:6px;height:50px;border-radius:99px;background:var(--ok)}.task.due-soon .stripe{background:var(--warn)}.task.overdue .stripe{background:var(--danger)}.task h3{margin:0 0 3px;font-size:16px}.meta{color:var(--muted);font-size:13px}.due{text-align:right;font-weight:800;white-space:nowrap}.due small{display:block;color:var(--muted);font-weight:500}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.tag{display:inline-block;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:650;background:#eef2ff;color:#4338ca}.tag.plain{background:#f1f5f9;color:#475569}
    .empty{background:var(--card);border:1px dashed #cbd5e1;border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}.error{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:16px}
    .gantt-card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.gantt-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcff;flex-wrap:wrap}.gantt-tools{display:flex;gap:7px;align-items:center}.gantt-tools button{padding:7px 10px}.gantt-hint{color:var(--muted);font-size:12px}.gantt-scroll{overflow:auto;overscroll-behavior:contain;cursor:grab;touch-action:pan-x pan-y}.gantt-scroll.dragging{cursor:grabbing;user-select:none}.gantt-grid{position:relative;min-width:100%}.gantt-head,.gantt-row{display:grid;grid-template-columns:220px var(--timeline-width)}.gantt-head{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);height:42px}.gantt-corner{position:sticky;left:0;z-index:12;background:#fff;border-right:1px solid var(--line);padding:12px 14px;font-size:12px;font-weight:750;color:#475569}.gantt-axis{position:relative;height:42px;background-color:#fff}.gantt-axis::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(to right,#e7eaf0 0 1px,transparent 1px var(--day-w));pointer-events:none}.gantt-tick{position:absolute;top:5px;transform:translateX(-50%);font-size:11px;color:#64748b;white-space:nowrap;z-index:2}.gantt-tick.month{font-weight:800;color:#334155}.gantt-row{height:64px;border-bottom:1px solid #eef2f7}.gantt-row:last-child{border-bottom:0}.gantt-label{position:sticky;left:0;z-index:8;background:#fff;border-right:1px solid var(--line);padding:9px 12px;min-width:0}.gantt-label b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;cursor:pointer}.gantt-label small{display:block;color:#dc2626;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;margin-top:2px}.gantt-track{position:relative;height:64px;background-image:repeating-linear-gradient(to right,#e7eaf0 0 1px,transparent 1px var(--day-w));background-color:#fbfcfe}.today-line{position:absolute;top:0;bottom:0;width:2px;background:#111827;opacity:.65;z-index:5;pointer-events:none}.today-line::before{content:"今天";position:absolute;top:2px;left:3px;background:#111827;color:#fff;border-radius:4px;padding:1px 4px;font-size:9px}.gantt-bar{position:absolute;top:22px;height:20px;min-width:10px;border-radius:7px;background:linear-gradient(90deg,#4f46e5,#8b5cf6);box-shadow:0 3px 8px rgba(79,70,229,.25);cursor:pointer;z-index:3}.gantt-bar.due-soon{background:linear-gradient(90deg,#d97706,#f59e0b)}.gantt-bar.overdue{background:linear-gradient(90deg,#dc2626,#f43f5e)}.gantt-bar:hover{filter:brightness(1.08)}.due-line{position:absolute;top:9px;bottom:8px;border-left:2px dashed #ef4444;z-index:4;pointer-events:none}.due-line::after{content:attr(data-due);position:absolute;top:-12px;left:5px;color:#b91c1c;background:#fff7f7;border:1px solid #fecaca;border-radius:5px;padding:1px 4px;font-size:10px;white-space:nowrap}.bar-dates{position:absolute;top:24px;left:7px;color:white;font-size:10px;font-weight:750;white-space:nowrap;pointer-events:none}.foot{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}
    .modal{position:fixed;inset:0;background:rgba(15,23,42,.58);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.open{display:flex}.dialog{background:#fff;width:min(780px,100%);max-height:86vh;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.3)}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.dialog h2{margin:0 0 6px;font-size:24px}.icon-button{background:#f1f5f9;color:#334155;padding:7px 11px;border-radius:9px}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.detail-item{background:#f8fafc;border-radius:11px;padding:11px}.detail-item span{display:block;color:var(--muted);font-size:12px}.detail-item b{font-size:14px}.description{background:#f8fafc;border-radius:12px;padding:14px;min-height:80px;overflow-wrap:anywhere}.description h1,.description h2,.description h3,.description h4{margin:.65em 0 .3em;line-height:1.3}.description h1:first-child,.description h2:first-child,.description h3:first-child{margin-top:0}.description p{margin:.45em 0}.description ul,.description ol{margin:.45em 0;padding-left:1.5em}.description pre{background:#111827;color:#e5e7eb;border-radius:8px;padding:10px;overflow:auto}.description code{background:#e2e8f0;border-radius:4px;padding:1px 4px}.description pre code{background:none;padding:0}.description table{border-collapse:collapse;width:100%;margin:8px 0}.description th,.description td{border:1px solid #cbd5e1;padding:6px}.description a{color:#4f46e5}.attachments{display:grid;gap:8px;margin-top:8px}.attachment-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.attachment-name{font-weight:700}.attachment-size{color:var(--muted);font-size:12px}.attachment-button{padding:7px 11px;font-size:13px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    @media(max-width:760px){.page{padding:16px}.hero{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}.task{grid-template-columns:5px minmax(0,1fr)}.due{grid-column:2;text-align:left}.stripe{grid-row:1/3}.detail-grid{grid-template-columns:1fr}.gantt-head,.gantt-row{grid-template-columns:150px var(--timeline-width)}.gantt-corner,.gantt-label{width:150px}.gantt-label{padding:8px}}
    body.embed .page{padding:8px;max-width:none}.embed .hero{display:none}.embed .stats{display:none}.embed .bar{margin-top:0;border-radius:12px}.embed .foot{display:none}.embed .section-title{margin-top:14px}
  </style>
</head>
<body>
<main class="page">
  <header class="hero"><div><h1>DDL 看板</h1><div class="sub">公开只读 · 点击任务查看详情</div></div><div class="actions"><button id="refresh" class="secondary">刷新</button><a class="button" href="__TODO_URL__projects/__PROJECT_ID__">登录并编辑</a></div></header>
  <section class="bar"><h2 id="next-title">正在读取 DDL…</h2><p id="next-text"></p></section>
  <section class="stats" id="stats"></section>
  <div class="section-title"><h2>任务列表</h2><span>点击任务查看详细说明</span></div>
  <section id="content"><div class="empty">正在加载…</div></section>
  <div class="section-title"><h2>时间轴 / Gantt</h2><span>每日竖线 · 拖动浏览 · 可缩放</span></div>
  <section id="gantt"><div class="empty">正在生成时间轴…</div></section>
  <div class="foot">数据来自 Vikunja · 公开页面仅展示未完成任务</div>
</main>
<div class="modal" id="task-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="dialog"><div class="dialog-head"><div><div class="meta" id="detail-id"></div><h2 id="detail-title"></h2></div><button class="icon-button" id="close-modal" aria-label="关闭">关闭</button></div><div id="detail-body"></div><div class="dialog-actions"><a class="button secondary" href="__TODO_URL__projects/__PROJECT_ID__">打开 Vikunja</a></div></div></div>
<script>
const PROJECT_ID=__PROJECT_ID__,VIEW_ID=__VIEW_ID__,SHARE_HASH='__SHARE_HASH__';
const DAY_MS=86400000;const $=s=>document.querySelector(s);let shareToken='',currentTasks=[],ganttDayWidth=46,ganttRange=null;
if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
async function jsonFetch(path,options={}){const res=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});if(!res.ok)throw new Error(`${res.status} ${await res.text()}`);return res.json()}
async function getToken(){if(shareToken)return shareToken;const data=await jsonFetch(`/api/v1/shares/${encodeURIComponent(SHARE_HASH)}/auth`,{method:'POST',body:JSON.stringify({password:''})});shareToken=data.token;return shareToken}
function validDate(value){if(!value||/^000[01]-/.test(value))return null;const d=new Date(value);return!Number.isNaN(d.getTime())&&d.getFullYear()>=2000?d:null}
function taskDue(t){return validDate(t.due_date)||validDate(t.end_date)}function taskStart(t){return validDate(t.start_date)||validDate(t.created)||new Date()}
const dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());function addDays(d,n){return new Date(d.getTime()+n*DAY_MS)}
function dueInfo(t){const due=taskDue(t);if(!due)return{label:'未设置 DDL',cls:''};const days=Math.ceil((dayStart(due)-dayStart(new Date()))/DAY_MS);let label;if(days<0)label=`逾期 ${Math.abs(days)} 天`;else if(days===0)label='今天到期';else if(days===1)label='明天到期';else label=`${days} 天后`;return{label,cls:days<0?'overdue':days<=3?'due-soon':''}}
function formatDate(value,short=false){const d=value instanceof Date?value:validDate(value);if(!d)return'未设置';return new Intl.DateTimeFormat('zh-CN',short?{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}:{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}
function personName(u){return u?(u.name||u.username||`用户 ${u.id}`):'未知'}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function labelChip(label){const title=label.title||label.name||'';const raw=String(label.hex_color||'').trim();const color=/^#[0-9a-f]{6}$/i.test(raw)?raw:(/^[0-9a-f]{6}$/i.test(raw)?`#${raw}`:'');return`<span class="tag ${color?'':'plain'}" style="${color?`background:${color}22;color:${color}`:''}">${escapeHtml(title)}</span>`}
function labelHtml(t,limit=99){const labels=(t.labels||[]).filter(Boolean).slice(0,limit);return labels.length?`<div class="tags">${labels.map(labelChip).join('')}</div>`:''}
function render(tasks){currentTasks=tasks;const open=tasks.filter(t=>!t.done).sort((a,b)=>{const ad=taskDue(a),bd=taskDue(b);if(!ad&&!bd)return a.id-b.id;if(!ad)return 1;if(!bd)return-1;return ad-bd});const overdue=open.filter(t=>{const d=taskDue(t);return d&&d<new Date()}).length;const soon=open.filter(t=>{const d=taskDue(t);if(!d)return false;const days=Math.ceil((dayStart(d)-dayStart(new Date()))/DAY_MS);return days>=0&&days<=3}).length;$('#stats').innerHTML=[['未完成任务',open.length],['已逾期',overdue],['3 天内到期',soon],['全部任务',tasks.length]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');if(!open.length){$('#next-title').textContent='当前没有未完成任务';$('#next-text').textContent='登录后可在 ddl 项目中添加待办和截止时间。';$('#content').innerHTML='<div class="empty">暂无待办。点击右上角“登录并编辑”开始添加。</div>';$('#gantt').innerHTML='<div class="empty">暂无任务可绘制时间轴。</div>';return}const next=open[0],nextDue=taskDue(next);$('#next-title').textContent=`下一项：${next.title}`;$('#next-text').textContent=`${nextDue?`截止 ${formatDate(nextDue)} · `:''}${dueInfo(next).label}`;$('#content').innerHTML=`<div class="list">${open.map(taskCard).join('')}</div>`;renderGantt(open)}
function taskCard(t){const due=dueInfo(t),dueDate=taskDue(t);const assignees=(t.assignees||[]).map(a=>a.username||a.name).filter(Boolean).join('、');return`<article class="task ${due.cls}" data-task-id="${t.id}" tabindex="0"><div class="stripe"></div><div><h3>${escapeHtml(t.title)}</h3><div class="meta">${t.identifier?escapeHtml(t.identifier)+' · ':''}${assignees?'负责人：'+escapeHtml(assignees):'未分配负责人'}</div>${labelHtml(t)}</div><div class="due">${escapeHtml(due.label)}${dueDate?`<small>${escapeHtml(formatDate(dueDate))}</small>`:''}</div></article>`}
function renderGantt(tasks,centerDate=null){const items=tasks.filter(taskDue);if(!items.length){$('#gantt').innerHTML='<div class="empty">任务尚未设置 DDL，暂时无法生成时间轴。</div>';return}let min=dayStart(new Date(Math.min(...items.map(t=>taskStart(t).getTime()))));let max=dayStart(new Date(Math.max(...items.map(t=>taskDue(t).getTime()))));min=addDays(min,-7);max=addDays(max,14);if(max-min<28*DAY_MS)max=addDays(min,28);const days=Math.max(29,Math.round((max-min)/DAY_MS)+1),timelineWidth=days*ganttDayWidth;ganttRange={min,max,days};const step=days<=60?1:days<=180?2:days<=730?7:30;let ticks='';for(let i=0;i<days;i+=step){const d=addDays(min,i);ticks+=`<div class="gantt-tick ${d.getDate()===1?'month':''}" style="left:${(i+.5)*ganttDayWidth}px">${d.getMonth()+1}/${d.getDate()}</div>`}const today=new Date(),todayX=(dayStart(today)-min)/DAY_MS*ganttDayWidth;const todayLine=today>=min&&today<=max?`<div class="today-line" style="left:${todayX}px"></div>`:'';const rows=items.sort((a,b)=>taskDue(a)-taskDue(b)).map(t=>{let start=taskStart(t);const end=taskDue(t);if(start>end)start=end;const left=Math.max(0,(start-min)/DAY_MS*ganttDayWidth);const width=Math.max(12,(end-start)/DAY_MS*ganttDayWidth);const dueX=(end-min)/DAY_MS*ganttDayWidth;const due=dueInfo(t);return`<div class="gantt-row"><div class="gantt-label"><b data-task-id="${t.id}" title="${escapeHtml(t.title)}">${escapeHtml(t.title)}</b><small>截止 ${escapeHtml(formatDate(end))}</small></div><div class="gantt-track" style="--day-w:${ganttDayWidth}px"><div class="today-line" style="left:${todayX}px"></div><div class="due-line" data-due="${escapeHtml(formatDate(end,true))}" style="left:${dueX}px"></div><div class="gantt-bar ${due.cls}" data-task-id="${t.id}" title="点击查看详情：${escapeHtml(t.title)}" style="left:${left}px;width:${width}px"><span class="bar-dates">${escapeHtml(formatDate(start,true))} → ${escapeHtml(formatDate(end,true))}</span></div></div></div>`}).join('');$('#gantt').innerHTML=`<div class="gantt-card"><div class="gantt-toolbar"><div class="gantt-hint">按住图表拖动浏览，右侧按钮可前后跳转</div><div class="gantt-tools"><button class="secondary" id="gantt-prev">← 更早</button><button class="secondary" id="gantt-today">今天</button><button class="secondary" id="gantt-next">更晚 →</button><button class="secondary" id="gantt-zoom-out">缩小</button><button class="secondary" id="gantt-zoom-in">放大</button></div></div><div class="gantt-scroll"><div class="gantt-grid" style="--timeline-width:${timelineWidth}px;--day-w:${ganttDayWidth}px"><div class="gantt-head"><div class="gantt-corner">任务 / DDL</div><div class="gantt-axis">${ticks}${todayLine}</div></div>${rows}</div></div></div>`;const scroller=$('.gantt-scroll');const center=centerDate||(today>=min&&today<=max?today:taskDue(items[0]));scroller.scrollLeft=Math.max(0,(center-min)/DAY_MS*ganttDayWidth-(scroller.clientWidth-220)/2);bindGantt(scroller)}
function bindGantt(scroller){let down=false,startX=0,startScroll=0,moved=false;scroller.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;startX=e.clientX;startScroll=scroller.scrollLeft;scroller.classList.add('dragging');scroller.setPointerCapture(e.pointerId)});scroller.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-startX;if(Math.abs(dx)>4)moved=true;scroller.scrollLeft=startScroll-dx});scroller.addEventListener('pointerup',e=>{if(!down)return;down=false;scroller.classList.remove('dragging');if(moved){e.preventDefault();e.stopPropagation();setTimeout(()=>moved=false,0)}});scroller.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation()}},true)}
function scrollGantt(delta){const s=$('.gantt-scroll');if(s)s.scrollBy({left:delta*Math.max(300,s.clientWidth*.72),behavior:'smooth'})}function centerGantt(date){const s=$('.gantt-scroll');if(s&&ganttRange)s.scrollTo({left:Math.max(0,(date-ganttRange.min)/DAY_MS*ganttDayWidth-(s.clientWidth-220)/2),behavior:'smooth'})}
async function openTask(id){const base=currentTasks.find(t=>t.id===Number(id));if(!base)return;$('#task-modal').classList.add('open');$('#detail-title').textContent='正在加载…';$('#detail-body').innerHTML='<div class="empty">读取详情…</div>';try{const token=await getToken();const detail=await jsonFetch(`/api/v1/tasks/${id}`,{headers:{Authorization:`Bearer ${token}`}});renderDetail(detail)}catch(e){$('#detail-title').textContent=base.title;$('#detail-body').innerHTML=`<div class="error">读取详情失败：${escapeHtml(e.message)}</div>`}}
function sanitizeRichText(html){
  const raw=String(html||'').trim();
  if(!raw)return '<p>当前任务没有填写详细说明。</p>';
  if(!/<\/?[a-z][\s\S]*>/i.test(raw))return `<p>${escapeHtml(raw).replace(/\n/g,'<br>')}</p>`;
  const allowed=new Set(['h1','h2','h3','h4','h5','h6','p','br','strong','b','em','i','u','s','del','ul','ol','li','blockquote','pre','code','a','span','div','table','thead','tbody','tfoot','tr','th','td','hr','img']);
  const doc=new DOMParser().parseFromString(raw,'text/html');
  for(const el of [...doc.body.querySelectorAll('*')].reverse()){
    const tag=el.tagName.toLowerCase();
    if(!allowed.has(tag)){el.replaceWith(...el.childNodes);continue}
    for(const attr of [...el.attributes]){
      const name=attr.name.toLowerCase();
      if(tag==='a'&&name==='href')continue;
      if(tag==='img'&&(name==='src'||name==='alt'))continue;
      if(name==='title')continue;
      el.removeAttribute(attr.name);
    }
    if(tag==='a'){
      const href=el.getAttribute('href')||'';
      if(!/^(https?:|mailto:)/i.test(href))el.removeAttribute('href');
      else{el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer')}
    }
    if(tag==='img'){
      const src=el.getAttribute('src')||'';
      if(!/^https?:/i.test(src)){el.remove();continue}
      el.setAttribute('loading','lazy');
    }
  }
  return doc.body.innerHTML;
}
function formatBytes(n){const x=Number(n||0);if(x<1024)return`${x} B`;if(x<1048576)return`${(x/1024).toFixed(1)} KB`;if(x<1073741824)return`${(x/1048576).toFixed(1)} MB`;return`${(x/1073741824).toFixed(1)} GB`}
function attachmentHtml(t){
  const rows=(t.attachments||[]).filter(Boolean).map(a=>{const f=a.file||{};const name=f.name||`附件-${a.id}`;return`<div class="attachment-row"><div><div class="attachment-name">${escapeHtml(name)}</div><div class="attachment-size">${escapeHtml(formatBytes(f.size))}</div></div><button class="attachment-button" data-download-attachment="1" data-task-id="${t.id}" data-attachment-id="${a.id}" data-file-name="${escapeHtml(name)}">下载</button></div>`}).join('');
  return rows?`<h3>相关附件</h3><div class="attachments">${rows}</div>`:'';
}
function renderDetail(t){const due=dueInfo(t),dueDate=taskDue(t),start=taskStart(t);const assignees=(t.assignees||[]).map(personName).join('、')||'未分配';$('#detail-id').textContent=t.identifier||`任务 ${t.id}`;$('#detail-title').textContent=t.title;$('#detail-body').innerHTML=`<div class="detail-grid"><div class="detail-item"><span>状态</span><b>${t.done?'已完成':'未完成'}</b></div><div class="detail-item"><span>DDL</span><b>${escapeHtml(formatDate(dueDate))} · ${escapeHtml(due.label)}</b></div><div class="detail-item"><span>开始时间</span><b>${escapeHtml(formatDate(start))}</b></div><div class="detail-item"><span>负责人</span><b>${escapeHtml(assignees)}</b></div><div class="detail-item"><span>创建人</span><b>${escapeHtml(personName(t.created_by))}</b></div><div class="detail-item"><span>优先级 / 进度</span><b>${escapeHtml(t.priority||0)} / ${escapeHtml(t.percent_done||0)}%</b></div></div>${labelHtml(t)}<h3>详情</h3><div class="description">${sanitizeRichText(t.description)}</div>${attachmentHtml(t)}`}
async function downloadAttachment(taskId,attachmentId,fileName){
  const button=document.querySelector(`[data-download-attachment][data-attachment-id="${attachmentId}"]`);
  try{
    if(button){button.disabled=true;button.textContent='下载中…'}
    const token=await getToken();
    const res=await fetch(`/api/v1/tasks/${taskId}/attachments/${attachmentId}`,{headers:{Authorization:`Bearer ${token}`}});
    if(!res.ok)throw new Error(`${res.status} ${await res.text()}`);
    const blob=await res.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=fileName||`attachment-${attachmentId}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }catch(e){alert(`附件下载失败：${e.message}`)}finally{if(button){button.disabled=false;button.textContent='下载'}}
}
function closeModal(){$('#task-modal').classList.remove('open')}
// Vikunja 每页最多 50 条，一页页取到不满一页为止；最多 40 页，防止接口异常时一直取下去
const PAGE_SIZE=50,MAX_PAGES=40;
async function fetchAllTasks(token){const all=[];for(let page=1;page<=MAX_PAGES;page++){const part=await jsonFetch(`/api/v1/projects/${PROJECT_ID}/views/${VIEW_ID}/tasks?per_page=${PAGE_SIZE}&page=${page}`,{headers:{Authorization:`Bearer ${token}`}});all.push(...part);if(part.length<PAGE_SIZE)break}return all}
async function load(){$('#refresh').disabled=true;try{const token=await getToken();const tasks=await fetchAllTasks(token);render(tasks)}catch(e){$('#content').innerHTML=`<div class="error">读取失败：${escapeHtml(e.message)}</div>`;$('#gantt').innerHTML=''}finally{$('#refresh').disabled=false}}
document.addEventListener('click',e=>{const dl=e.target.closest('[data-download-attachment]');if(dl){e.preventDefault();e.stopPropagation();return downloadAttachment(dl.dataset.taskId,dl.dataset.attachmentId,dl.dataset.fileName)}if(e.target.id==='gantt-prev')return scrollGantt(-1);if(e.target.id==='gantt-next')return scrollGantt(1);if(e.target.id==='gantt-today')return centerGantt(new Date());if(e.target.id==='gantt-zoom-out'){ganttDayWidth=Math.max(26,ganttDayWidth-8);return renderGantt(currentTasks.filter(t=>!t.done))}if(e.target.id==='gantt-zoom-in'){ganttDayWidth=Math.min(86,ganttDayWidth+8);return renderGantt(currentTasks.filter(t=>!t.done))}const target=e.target.closest('[data-task-id]');if(target)openTask(target.dataset.taskId)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();const target=e.target.closest?.('[data-task-id]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openTask(target.dataset.taskId)}});$('#task-modal').addEventListener('click',e=>{if(e.target.id==='task-modal')closeModal()});$('#close-modal').addEventListener('click',closeModal);$('#refresh').addEventListener('click',load);load();
</script>
</body>
