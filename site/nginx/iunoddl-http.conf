# DDL 看板的 80 端口：给 Let's Encrypt 验证域名用，其余一律跳到 HTTPS。由 deploy-site.sh 生成。
server {
    listen 80;
    listen [::]:80;
    server_name __DDL_DOMAIN__ __TODO_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root __WEB_ROOT__;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
