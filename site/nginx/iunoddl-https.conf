# DDL 看板（__DDL_DOMAIN__）和 Vikunja 管理后台（__TODO_DOMAIN__）。由 deploy-site.sh 生成。
# 注意：nginx 的 add_header 只要子块里写了一条，就不再继承外层的，所以安全头在每个 location 里各写一份。

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DDL_DOMAIN__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root __WEB_ROOT__;
    index index.html;

    # 看板前端用公开分享换来的只读令牌访问这些接口
    location /api/ {
        proxy_pass http://127.0.0.1:__VIKUNJA_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 作业详情里可能有外链图片，所以 img-src 放开 https:；frame-ancestors 决定哪些网站能嵌入看板
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data: https:; base-uri 'self'; form-action 'self'; frame-ancestors __FRAME_ANCESTORS__" always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __TODO_DOMAIN__;

    ssl_certificate __CERT_DIR__/fullchain.pem;
    ssl_certificate_key __CERT_DIR__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 和 Vikunja 的附件大小上限一致
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__VIKUNJA_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;

        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
